<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>80 дней вместе ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
      font-family: -apple-system, 'Segoe UI', 'Roboto', system-ui, sans-serif;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 32px 20px 40px;
      box-shadow: 0 20px 50px rgba(183, 28, 28, 0.2),
                  0 8px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 700;
      color: #b71c1c;
      letter-spacing: 1px;
      text-shadow: 0 4px 12px rgba(183, 28, 28, 0.15);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #880e4f;
      background: rgba(255, 255, 255, 0.6);
      display: inline-block;
      padding: 5px 20px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      margin-bottom: 20px;
      font-weight: 500;
      border: 1px solid #f48fb1;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #f06292, #b71c1c, #f06292);
      margin: 8px auto 18px;
      border-radius: 10px;
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #4a1a2a;
      background: rgba(255, 255, 255, 0.4);
      padding: 18px 16px;
      border-radius: 28px;
      backdrop-filter: blur(4px);
      margin-bottom: 24px;
      font-weight: 400;
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: left;
    }

    .message span {
      font-weight: 600;
      color: #b71c1c;
    }

    .days-badge {
      display: inline-block;
      background: linear-gradient(135deg, #b71c1c, #e53935);
      color: white;
      font-size: 2rem;
      font-weight: 700;
      padding: 12px 32px;
      border-radius: 50px;
      box-shadow: 0 10px 24px rgba(183, 28, 28, 0.35);
      margin-bottom: 24px;
      letter-spacing: 1px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .days-badge small {
      font-size: 1rem;
      font-weight: 400;
      opacity: 0.9;
      margin-left: 4px;
    }

    .signature {
      font-size: 1.1rem;
      color: #880e4f;
      font-weight: 500;
      margin-top: 8px;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    .signature i {
      font-style: normal;
      display: inline-block;
      animation: heartbeat 1.6s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      56% { transform: scale(1); }
    }

    #hearts-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Специально для маленьких телефонов */
    @media (max-width: 380px) {
      .card {
        padding: 24px 14px 32px;
        border-radius: 32px;
      }
      .title {
        font-size: 2rem;
      }
      .message {
        font-size: 1rem;
        padding: 14px 14px;
      }
      .days-badge {
        font-size: 1.6rem;
        padding: 10px 24px;
      }
      .subtitle {
        font-size: 0.95rem;
        padding: 4px 16px;
      }
    }

    /* Для очень больших экранов (планшеты) */
    @media (min-width: 768px) {
      .card {
        max-width: 520px;
        padding: 48px 40px 56px;
      }
      .title {
        font-size: 3rem;
      }
      .message {
        font-size: 1.2rem;
        padding: 24px 24px;
      }
    }
  </style>
</head>
<body>

  <canvas id="hearts-canvas"></canvas>

  <div class="card">
    <div class="title">80 дней ❤️</div>
    <div class="subtitle">с тобой — как одно мгновение</div>
    <div class="divider"></div>

    <div class="message">
      <span>Моя любимая</span>, спасибо за каждую улыбку, каждый взгляд и каждую минуту рядом.
      Эти <span>80 дней</span> стали самыми тёплыми в моей жизни.
      Ты — моё счастье, и я хочу, чтобы мы вместе прожили ещё тысячи таких дней.
    </div>

    <div class="days-badge">
      80 <small>дней</small>
    </div>

    <div class="signature">
      С любовью, твой дурашик <i>❤️</i>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('hearts-canvas');
      const ctx = canvas.getContext('2d');

      let W, H;
      let hearts = [];
      const MAX_HEARTS = 60; // чуть меньше для телефона (оптимизация)
      const SYMBOL = '❤️';

      function resizeCanvas() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Heart {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * W;
          this.y = -20 - Math.random() * 80;
          this.size = 10 + Math.floor(Math.random() * 16); // 10-26px (поменьше для телефона)
          this.speed = 0.8 + Math.random() * 1.4;
          this.wobble = 0.4 + Math.random() * 0.6;
          this.phase = Math.random() * Math.PI * 2;
          this.opacity = 0.4 + Math.random() * 0.5;
          this.rotation = (Math.random() - 0.5) * 0.2;
        }

        update() {
          this.y += this.speed;
          this.x += Math.sin(this.phase + this.y * 0.025) * this.wobble * 0.3;
          if (this.y > H + 40) {
            this.reset();
            this.y = -20 - Math.random() * 60;
          }
          if (this.x < -20) this.x = W + 20;
          if (this.x > W + 20) this.x = -20;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.font = `${this.size}px "Segoe UI", "Arial", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const gradient = ctx.createRadialGradient(0, 0, 2, 0, 0, this.size);
          gradient.addColorStop(0, '#ff4d6d');
          gradient.addColorStop(0.6, '#e91e63');
          gradient.addColorStop(1, '#b71c1c');
          ctx.fillStyle = gradient;
          ctx.shadowColor = 'rgba(183, 28, 28, 0.3)';
          ctx.shadowBlur = 8;
          ctx.fillText(SYMBOL, 0, 0);
          ctx.restore();
        }
      }

      function initHearts() {
        hearts = [];
        for (let i = 0; i < MAX_HEARTS; i++) {
          const h = new Heart();
          h.y = Math.random() * H;
          hearts.push(h);
        }
      }
      initHearts();

      function drawHearts() {
        ctx.clearRect(0, 0, W, H);
        for (let h of hearts) {
          h.update();
          h.draw();
        }
        requestAnimationFrame(drawHearts);
      }

      drawHearts();

      window.addEventListener('resize', () => {
        resizeCanvas();
        for (let h of hearts) {
          h.x = Math.min(h.x, W - 10);
          h.y = Math.min(h.y, H - 10);
        }
      });
    })();
  </script>

</body>
</html>
