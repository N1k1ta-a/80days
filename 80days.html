<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80 дней вместе ❤️</title>
  <style>
    /* Основные стили */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Контейнер открытки */
    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 40px 30px 50px;
      box-shadow: 0 30px 60px rgba(183, 28, 28, 0.25),
                  0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.5);
      text-align: center;
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    /* Заголовок */
    .title {
      font-size: 2.8rem;
      font-weight: 700;
      color: #b71c1c;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(183, 28, 28, 0.2);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #880e4f;
      background: rgba(255, 255, 255, 0.5);
      display: inline-block;
      padding: 6px 24px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      margin-bottom: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
      border: 1px solid #f48fb1;
    }

    /* Основной текст */
    .message {
      font-size: 1.35rem;
      line-height: 1.7;
      color: #4a1a2a;
      background: rgba(255, 255, 255, 0.4);
      padding: 22px 20px;
      border-radius: 36px;
      backdrop-filter: blur(4px);
      margin-bottom: 30px;
      font-weight: 400;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .message span {
      font-weight: 600;
      color: #b71c1c;
    }

    /* Счетчик дней (крупно) */
    .days-badge {
      display: inline-block;
      background: linear-gradient(135deg, #b71c1c, #e53935);
      color: white;
      font-size: 2.2rem;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 60px;
      box-shadow: 0 12px 24px rgba(183, 28, 28, 0.4);
      margin-bottom: 30px;
      letter-spacing: 2px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .days-badge small {
      font-size: 1.2rem;
      font-weight: 400;
      opacity: 0.9;
      margin-left: 6px;
    }

    /* Подпись */
    .signature {
      font-size: 1.2rem;
      color: #880e4f;
      font-weight: 500;
      margin-top: 12px;
      letter-spacing: 0.8px;
      opacity: 0.8;
    }

    .signature i {
      font-style: normal;
      display: inline-block;
      animation: heartbeat 1.6s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.2); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      56% { transform: scale(1); }
      100% { transform: scale(1); }
    }

    /* Контейнер для падающих сердечек (canvas) */
    #hearts-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Адаптивность */
    @media (max-width: 480px) {
      .card {
        padding: 30px 16px 40px;
      }
      .title {
        font-size: 2.2rem;
      }
      .message {
        font-size: 1.1rem;
        padding: 18px 16px;
      }
      .days-badge {
        font-size: 1.8rem;
        padding: 12px 28px;
      }
      .subtitle {
        font-size: 1rem;
        padding: 4px 18px;
      }
    }

    /* Декоративная линия */
    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #f06292, #b71c1c, #f06292);
      margin: 12px auto 22px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Холст для падающих сердечек -->
  <canvas id="hearts-canvas"></canvas>

  <!-- Главная открытка -->
  <div class="card">
    <div class="title">80 дней ❤️</div>
    <div class="subtitle">с тобой — как одно мгновение</div>
    <div class="divider"></div>

    <div class="message">
      <span>Моя любимая</span>, спасибо за каждую улыбку, каждый взгляд и каждую минуту рядом.
      Эти <span>80 дней</span> стали самыми тёплыми в моей жизни.
      Ты — моё счастье, и я хочу, чтобы мы вместе прожили ещё тысячи таких дней.
    </div>

    <div class="days-badge">
      80 <small>дней</small>
    </div>

    <div class="signature">
      С любовью, твой <i>❤️</i>
    </div>
  </div>

  <script>
    (function() {
      // ---------- Падающие сердечки (canvas) ----------
      const canvas = document.getElementById('hearts-canvas');
      const ctx = canvas.getContext('2d');

      let W, H;
      let hearts = [];
      const MAX_HEARTS = 80; // по числу дней
      const SYMBOL = '❤️';   // можно заменить на '♥' если нужен чистый текст

      function resizeCanvas() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // Сердце как объект
      class Heart {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * W;
          this.y = -20 - Math.random() * 100;
          this.size = 12 + Math.floor(Math.random() * 20); // 12-32px
          this.speed = 1.2 + Math.random() * 1.8;          // скорость падения
          this.wobble = 0.6 + Math.random() * 0.8;          // амплитуда покачивания
          this.phase = Math.random() * Math.PI * 2;
          this.opacity = 0.5 + Math.random() * 0.5;
          this.rotation = (Math.random() - 0.5) * 0.3;      // небольшой поворот
        }

        update() {
          this.y += this.speed;
          this.x += Math.sin(this.phase + this.y * 0.02) * this.wobble * 0.4;
          // если выходит за нижнюю границу — сбросить наверх
          if (this.y > H + 40) {
            this.reset();
            this.y = -20 - Math.random() * 80;
          }
          // если уходит слишком вбок — мягко возвращаем
          if (this.x < -20) this.x = W + 20;
          if (this.x > W + 20) this.x = -20;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          // Рисуем сердечко через текст (просто и красиво)
          ctx.font = `${this.size}px "Segoe UI", "Arial", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          // Градиент для объема
          const gradient = ctx.createRadialGradient(0, 0, 2, 0, 0, this.size);
          gradient.addColorStop(0, '#ff4d6d');
          gradient.addColorStop(0.6, '#e91e63');
          gradient.addColorStop(1, '#b71c1c');
          ctx.fillStyle = gradient;
          ctx.shadowColor = 'rgba(183, 28, 28, 0.4)';
          ctx.shadowBlur = 12;
          ctx.fillText(SYMBOL, 0, 0);
          ctx.restore();
        }
      }

      // Инициализация массива сердечек
      function initHearts() {
        hearts = [];
        for (let i = 0; i < MAX_HEARTS; i++) {
          const h = new Heart();
          // разброс по высоте для равномерного заполнения
          h.y = Math.random() * H;
          hearts.push(h);
        }
      }
      initHearts();

      // Анимация
      function drawHearts() {
        ctx.clearRect(0, 0, W, H);

        for (let h of hearts) {
          h.update();
          h.draw();
        }

        requestAnimationFrame(drawHearts);
      }

      drawHearts();

      // Пересоздавать сердечки при ресайзе (чтобы не вылезали за границы)
      window.addEventListener('resize', () => {
        resizeCanvas();
        // обновим позиции для новых размеров
        for (let h of hearts) {
          h.x = Math.min(h.x, W - 10);
          h.y = Math.min(h.y, H - 10);
        }
      });

      // ---------- (опционально) легкий параллакс при движении мыши ----------
      // можно добавить совсем легкое смещение фона, но не обязательно
      // просто для атмосферы — оставим как есть

      console.log('❤️ 80 дней вместе! Поздравляю! ❤️');
    })();
  </script>

</body>
</html>
